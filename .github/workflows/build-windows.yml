name: Build Windows

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out Sygnature
        uses: actions/checkout@v7.0.1
        with:
          path: sygnature_ng

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
          pub-cache: true

      - name: Cache Rust and native builds
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            sygnature_ng/.dart_tool/hooks_runner/shared
          key: ${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('sygnature_ng/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-native-

      - name: Resolve dependencies
        working-directory: sygnature_ng
        run: flutter pub get

      - name: Build Windows release
        working-directory: sygnature_ng
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release --no-pub

      - name: Upload Windows application
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sygnature-windows-x64
          path: sygnature_ng/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 30
