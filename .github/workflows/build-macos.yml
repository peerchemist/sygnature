name: Build macOS DMG

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out Sygnature
        uses: actions/checkout@v7.0.1
        with:
          path: sygnature_ng

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
          pub-cache: true

      - name: Cache Rust, native builds, and CocoaPods downloads
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            ~/Library/Caches/CocoaPods
            sygnature_ng/.dart_tool/hooks_runner/shared
          key: ${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('sygnature_ng/pubspec.lock', 'sygnature_ng/macos/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-native-

      - name: Resolve dependencies
        working-directory: sygnature_ng
        run: flutter pub get

      - name: Build macOS DMG
        working-directory: sygnature_ng
        run: scripts/build_macos --no-pub

      - name: Upload DMG
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sygnature-macos-dmg
          path: sygnature_ng/build/Sygnature-macOS.dmg
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish DMG to GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG"; then
            args=(--verify-tag --title "$RELEASE_TAG" --generate-notes)
            if [[ "$RELEASE_TAG" == *-* ]]; then
              args+=(--prerelease)
            fi
            # Another platform may create the release at the same time.
            gh release create "$RELEASE_TAG" "${args[@]}" || gh release view "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" sygnature_ng/build/Sygnature-macOS.dmg --clobber
