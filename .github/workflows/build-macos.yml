name: Build macOS DMG
run-name: ${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name) || format('Manual build {0}', github.ref_name) }}

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'peerchemist/sygnature'
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            dmg: Sygnature-macOS-arm64.dmg
          - arch: x86_64
            runner: macos-15-intel
            dmg: Sygnature-macOS-x86_64.dmg

    steps:
      - name: Check out Sygnature
        uses: actions/checkout@v7.0.1
        with:
          path: sygnature_ng
          persist-credentials: false

      - name: Import Developer ID and validate notarization credentials
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          source sygnature_ng/scripts/apple_network_retry.sh
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required repository secret is missing: $name"
              exit 1
            fi
          done
          certificate="$RUNNER_TEMP/sygnature-signing.p12"
          keychain="$RUNNER_TEMP/sygnature-signing.keychain-db"
          keychain_password="$(uuidgen)-$(uuidgen)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign >/dev/null
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          identity="$(security find-identity -v -p codesigning "$keychain" | python3 -c '
          import os, re, sys
          identities = re.findall(r"([0-9A-F]{40}) .Developer ID Application: .* \(([^)]+)\).", sys.stdin.read())
          matches = [fingerprint for fingerprint, team in identities if team == os.environ["APPLE_TEAM_ID"]]
          if len(matches) != 1:
              sys.exit("Expected exactly one valid Developer ID Application identity for APPLE_TEAM_ID")
          print(matches[0])
          ')"
          xcrun notarytool store-credentials Sygnature-CI --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --no-validate >/dev/null
          apple_network_retry xcrun notarytool history --keychain-profile Sygnature-CI --keychain "$keychain" >/dev/null
          {
            echo "MACOS_SIGNING_IDENTITY=$identity"
            echo "MACOS_SIGNING_KEYCHAIN=$keychain"
            echo "NOTARYTOOL_PROFILE=Sygnature-CI"
          } >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
          pub-cache: true

      - name: Cache Rust, native builds, and CocoaPods downloads
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            ~/Library/Caches/CocoaPods
            sygnature_ng/.dart_tool/hooks_runner/shared
          key: ${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('sygnature_ng/pubspec.lock', 'sygnature_ng/macos/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-native-

      - name: Resolve dependencies
        working-directory: sygnature_ng
        run: flutter pub get

      - name: Build macOS DMG
        working-directory: sygnature_ng
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_ARCH: ${{ matrix.arch }}
          DMG_NAME: ${{ matrix.dmg }}
        run: scripts/build_macos --no-pub --arch "$MACOS_ARCH" --output "build/$DMG_NAME"

      - name: Upload DMG
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sygnature-macos-${{ matrix.arch }}-dmg
          path: sygnature_ng/build/${{ matrix.dmg }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish DMG to GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          DMG_PATH: sygnature_ng/build/${{ matrix.dmg }}
        run: |
          test -f "$DMG_PATH"
          if ! gh release view "$RELEASE_TAG"; then
            args=(--verify-tag --title "$RELEASE_TAG" --generate-notes)
            if [[ "$RELEASE_TAG" == *-* ]]; then
              args+=(--prerelease)
            fi
            # Another architecture or platform may create the release at the same time.
            gh release create "$RELEASE_TAG" "${args[@]}" || gh release view "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" "$DMG_PATH" --clobber

      - name: Remove signing credentials
        if: always()
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/sygnature-signing.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi
          rm -f "$RUNNER_TEMP/sygnature-signing.p12"
