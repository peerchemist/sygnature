name: Build macOS DMG

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out Sygnature
        uses: actions/checkout@v7.0.1
        with:
          path: sygnature_ng

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: sygnature_ng
        run: flutter pub get

      - name: Build macOS DMG
        working-directory: sygnature_ng
        run: scripts/build_macos --no-pub

      - name: Upload DMG
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sygnature-macos-dmg
          path: sygnature_ng/build/Sygnature-macOS.dmg
          if-no-files-found: error
          retention-days: 30
