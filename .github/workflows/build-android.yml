name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out Sygnature
        uses: actions/checkout@v7.0.1
        with:
          path: sygnature_ng

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            sygnature_ng/android/**/*.gradle*
            sygnature_ng/android/**/gradle-wrapper.properties
            sygnature_ng/android/gradle.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
          pub-cache: true

      - name: Cache Rust and native builds
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            sygnature_ng/.dart_tool/hooks_runner/shared
          key: ${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('sygnature_ng/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-native-

      - name: Resolve dependencies
        working-directory: sygnature_ng
        run: flutter pub get

      - name: Build release APK
        working-directory: sygnature_ng
        run: flutter build apk --release --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sygnature-android-apk
          path: sygnature_ng/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
