name: Build Linux Flatpak

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out Sygnature
        uses: actions/checkout@v7.0.1
        with:
          path: sygnature_ng

      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder

      - name: Cache Flatpak runtimes
        uses: actions/cache@v6.1.0
        with:
          path: ~/.local/share/flatpak
          key: ${{ runner.os }}-flatpak-runtime-26.08

      - name: Cache Flatpak builder state
        uses: actions/cache@v6.1.0
        with:
          path: |
            sygnature_ng/.flatpak-builder/cache
            sygnature_ng/.flatpak-builder/ccache
            sygnature_ng/.flatpak-builder/downloads
            sygnature_ng/.flatpak-builder/git
          key: ${{ runner.os }}-flatpak-builder-${{ hashFiles('sygnature_ng/.flatpak/**', 'sygnature_ng/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flatpak-builder-

      - name: Build Flatpak bundle
        working-directory: sygnature_ng
        run: scripts/build_flatpak

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sygnature-linux-flatpak
          path: sygnature_ng/build/flatpak/network.noosphere.sygnature.flatpak
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
