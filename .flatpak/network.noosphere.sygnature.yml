app-id: network.noosphere.sygnature
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
  - org.freedesktop.Sdk.Extension.rust-stable
command: sygnature

cleanup:
  - /flutter

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.secrets

modules:
  - name: flutter-sdk
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - flutter/bin/flutter config --no-analytics
      - flutter/bin/flutter precache --linux
      - install -d /app/flutter
      - cp -a flutter/. /app/flutter/
    sources:
      - type: git
        url: https://github.com/flutter/flutter.git
        commit: ab2912035e160d9cad6306df307576da6128ebdb
        tag: 3.50.0
        dest: flutter

  - name: sygnature
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
      append-path: /run/build/sygnature/rustup-wrapper:/usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm22/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
      env:
        CARGO_HOME: /run/build/sygnature/.cargo
        PUB_CACHE: /run/build/sygnature/.pub-cache
    build-commands:
      - cp -a --reflink=auto /app/flutter flutter
      - flutter/bin/flutter config --no-analytics
      - cd app && ../flutter/bin/flutter pub get
      - cd app && ../flutter/bin/flutter build linux --release --no-pub
      - install -d /app/lib/sygnature /app/bin
      - cp -a app/build/linux/*/release/bundle/. /app/lib/sygnature/
      - ln -s /app/lib/sygnature/sygnature /app/bin/sygnature
      - install -Dm644 app/.flatpak/network.noosphere.sygnature.desktop /app/share/applications/network.noosphere.sygnature.desktop
      - install -Dm644 app/.flatpak/network.noosphere.sygnature.service /app/share/dbus-1/services/network.noosphere.sygnature.service
      - |
        version="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' app/pubspec.yaml)"
        test -n "$version"
        sed "s|<release version=\"[^\"]*\"|<release version=\"$version\"|" app/.flatpak/network.noosphere.sygnature.metainfo.xml > network.noosphere.sygnature.metainfo.xml
        install -Dm644 network.noosphere.sygnature.metainfo.xml /app/share/metainfo/network.noosphere.sygnature.metainfo.xml
      - install -Dm644 app/assets/branding/app-icon.png /app/share/icons/hicolor/512x512/apps/network.noosphere.sygnature.png
      - install -Dm644 app/assets/branding/app-icon.svg /app/share/icons/hicolor/scalable/apps/network.noosphere.sygnature.svg
    sources:
      - type: dir
        path: ..
        dest: app
        skip:
          - .agents
          - .codex
          - .dart_tool
          - .flatpak-builder
          - .flutter-plugins-dependencies
          - .git
          - .idea
          - .windows-builder
          - android/.gradle
          - android/.kotlin
          - android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          - android/local.properties
          - android/sygnature_ng_android.iml
          - build
          - ios/Flutter/Generated.xcconfig
          - ios/Flutter/ephemeral
          - ios/Flutter/flutter_export_environment.sh
          - ios/Runner/GeneratedPluginRegistrant.h
          - ios/Runner/GeneratedPluginRegistrant.m
          - linux/flutter/ephemeral
          - macos/Flutter/ephemeral
          - sygnature_ng.iml
          - todo.md
          - windows/flutter/ephemeral
      - type: file
        path: rustup
        dest: rustup-wrapper
